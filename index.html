<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#201830" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>外部ディスプレイ｜売上同期</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#201830; --bg2:#2b2142; --line:#3a2f52;
    --ink:#f3ecf7; --muted:#a79bb8; --faint:#7a6f8e;
    --gold:#f6c56b; --gold-soft:rgba(246,197,107,.14);
    --live:#6fe0b0;
    --pad: clamp(16px, 4vw, 40px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(140% 90% at 50% -10%, #2c2144 0%, var(--bg) 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Zen Maru Gothic", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .num{font-family:"Roboto Mono", monospace; font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;}
  #app{height:100vh; height:100dvh; display:flex; flex-direction:column;}
  .screen{flex:1; min-height:0; display:none; flex-direction:column;}
  .screen.on{display:flex;}

  /* ---------- shared top bar ---------- */
  .bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding: var(--pad) var(--pad) 0;
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
  .brand .name{font-weight:700; font-size:clamp(15px,2.6vw,20px); color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .status{display:flex; align-items:center; gap:14px; flex:none; color:var(--muted); font-size:clamp(12px,2vw,15px)}
  .live{display:flex; align-items:center; gap:7px; color:var(--live); font-weight:700}
  .live .pulse{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(111,224,176,.6);animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,224,176,.55)}70%{box-shadow:0 0 0 12px rgba(111,224,176,0)}100%{box-shadow:0 0 0 0 rgba(111,224,176,0)}}
  .remain .num{color:var(--ink)}

  /* ---------- LIVE screen ---------- */
  #live .total-wrap{
    flex:1; min-height:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px; padding: 0 var(--pad);
  }
  .total-label{color:var(--muted); font-weight:700; letter-spacing:.22em; font-size:clamp(13px,2.4vw,17px)}
  .total{
    display:flex; align-items:baseline; gap:.12em; line-height:.9;
    color:var(--gold); text-shadow:0 0 34px rgba(246,197,107,.28);
  }
  .total .yen{font-family:"Zen Maru Gothic",sans-serif; font-weight:900; font-size:clamp(30px,7vw,64px)}
  .total .figure{font-weight:700; font-size:clamp(64px,20vw,190px); letter-spacing:-.01em}
  .count-pill{
    margin-top:6px; color:var(--muted); font-size:clamp(13px,2.2vw,16px);
  }
  .count-pill .num{color:var(--ink); font-weight:700}

  .items{
    flex:none; max-height:38vh; overflow:hidden;
    margin: 0 var(--pad) calc(var(--pad) - 6px);
    border-top:1px solid var(--line);
  }
  .row{
    display:grid; grid-template-columns: 1fr auto auto; align-items:center; gap:14px;
    padding:clamp(9px,1.7vh,15px) 2px; border-bottom:1px solid var(--line);
    transition:background .25s;
  }
  .row.flash{background:var(--gold-soft)}
  .row .name{font-weight:700; font-size:clamp(15px,2.6vw,22px); display:flex; align-items:center; gap:10px; min-width:0}
  .row .name .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
  .kbadge{flex:none; font-size:clamp(10px,1.7vw,13px); font-weight:900; letter-spacing:.02em; padding:2px 9px; border-radius:7px; line-height:1.6}
  .kbadge.k-new{background:var(--gold-soft); color:var(--gold)}
  .kbadge.k-old{background:rgba(255,255,255,.09); color:var(--muted)}
  .row .qty{color:var(--muted); font-size:clamp(13px,2.2vw,18px)}
  .row .qty .num{color:var(--ink); font-weight:700}
  .row .sub{color:var(--gold); font-weight:700; font-size:clamp(15px,2.6vw,22px); text-align:right; min-width:5ch}
  .foot{
    padding:0 var(--pad) var(--pad); color:var(--faint);
    font-size:clamp(11px,1.8vw,14px); display:flex; justify-content:space-between; gap:10px;
  }

  /* ---------- PAIRING screen ---------- */
  .center{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(16px,3vh,26px); padding:var(--pad); text-align:center}
  .eyebrow{color:var(--muted); font-weight:700; letter-spacing:.18em; font-size:clamp(12px,2.2vw,15px)}
  .headline{font-weight:900; font-size:clamp(22px,4.6vw,34px); line-height:1.25}
  .qcard{
    background:#f3ecf7; padding:clamp(14px,2.4vw,20px); border-radius:20px;
    box-shadow:0 18px 50px rgba(0,0,0,.35); line-height:0;
  }
  .qcard img, .qcard canvas{display:block; width:clamp(180px,42vw,260px); height:auto;}
  .pin{
    display:flex; align-items:center; gap:clamp(8px,1.6vw,14px); flex-wrap:wrap; justify-content:center;
  }
  .pin .d{
    background:var(--bg2); border:1px solid var(--line); border-radius:12px;
    padding:clamp(8px,1.4vh,14px) clamp(9px,1.6vw,15px);
    font-weight:700; font-size:clamp(26px,6vw,46px); color:var(--ink); min-width:1.1em; text-align:center;
  }
  .pin .sep{color:var(--faint); font-weight:700}
  .hint{color:var(--muted); font-size:clamp(13px,2.4vw,17px); max-width:30ch; line-height:1.6}
  .hint b{color:var(--gold)}
  .subhint{color:var(--faint); font-size:clamp(11px,1.9vw,13px)}

  /* ---------- notice screens (expired / locked / error) ---------- */
  .glyph{
    width:clamp(56px,12vw,84px); height:clamp(56px,12vw,84px); border-radius:50%;
    display:grid; place-items:center; background:var(--bg2); border:1px solid var(--line);
    font-size:clamp(28px,6vw,42px);
  }
  .notice-title{font-weight:900; font-size:clamp(20px,4.4vw,30px)}
  .notice-body{color:var(--muted); font-size:clamp(14px,2.6vw,18px); max-width:26ch; line-height:1.7}
  .btn{
    margin-top:6px; appearance:none; border:1px solid var(--line); background:var(--bg2); color:var(--ink);
    font-family:inherit; font-weight:700; font-size:clamp(14px,2.4vw,16px);
    padding:12px 22px; border-radius:999px; cursor:pointer;
  }
  .btn:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
  .btn:active{transform:translateY(1px)}

  /* ---------- OSHINAGAKI (idle image) ---------- */
  #oshi{padding:0}
  #oshi .oshi-wrap{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:clamp(6px,1.6vw,18px)}
  #oshi img{max-width:100%; max-height:100%; object-fit:contain; border-radius:14px}

  /* ---------- settings gear + modal ---------- */
  .gear{
    position:fixed; top:calc(env(safe-area-inset-top) + 8px); right:calc(env(safe-area-inset-right) + 8px);
    z-index:40; width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:rgba(43,33,66,.55); color:var(--muted); display:grid; place-items:center;
    font-size:20px; opacity:.45; cursor:pointer; backdrop-filter:blur(4px);
  }
  .gear:active{transform:translateY(1px)}
  .fsbtn{
    position:fixed; top:calc(env(safe-area-inset-top) + 8px); right:calc(env(safe-area-inset-right) + 58px);
    z-index:40; width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:rgba(43,33,66,.55); color:var(--muted); display:grid; place-items:center;
    opacity:.45; cursor:pointer; backdrop-filter:blur(4px);
  }
  .fsbtn:active{transform:translateY(1px)}
  .fsbtn svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  /* 横画面ではボタンを少し目立たせる */
  @media (orientation: landscape){ .fsbtn, .gear{ opacity:.6 } }
  .modal{
    position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    padding:20px; background:rgba(10,6,18,.6); backdrop-filter:blur(3px);
  }
  .modal.on{display:flex}
  .sheet{
    width:100%; max-width:440px; background:var(--bg2); border:1px solid var(--line); border-radius:20px;
    padding:22px; color:var(--ink); max-height:88vh; overflow:auto;
  }
  .sheet h2{font-size:20px; margin-bottom:2px}
  .sheet p.sub{color:var(--muted); font-size:13px; line-height:1.6}
  .field{margin:18px 0}
  .field .label{font-weight:700; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:10px}
  .preview{
    width:100%; aspect-ratio:4/3; background:var(--bg); border:1px dashed var(--line); border-radius:12px;
    display:grid; place-items:center; overflow:hidden; color:var(--faint); font-size:13px;
  }
  .preview img{width:100%; height:100%; object-fit:contain}
  .row-btns{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}
  .mini{
    appearance:none; border:1px solid var(--line); background:var(--bg); color:var(--ink);
    font:inherit; font-weight:700; font-size:14px; padding:10px 16px; border-radius:12px; cursor:pointer;
  }
  .mini.primary{background:var(--gold); color:#2a1c00; border-color:transparent}
  .mini.danger{color:#f0a0a0}
  .mini:active{transform:translateY(1px)}
  .switch{position:relative; width:52px; height:30px; flex:none}
  .switch input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer}
  .switch .track{position:absolute; inset:0; background:var(--line); border-radius:999px; transition:background .2s}
  .switch .thumb{position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .2s}
  .switch input:checked ~ .track{background:var(--gold)}
  .switch input:checked ~ .thumb{left:25px}

  @media (prefers-reduced-motion: reduce){
    .live .pulse{animation:none}
    *{transition:none !important}
  }

  /* ===== 横画面（タブレット等）最適化：縦積みのまま高さに収める ===== */
  @media (orientation: landscape){
    :root{ --pad: clamp(12px, 2.6vh, 26px); }
    .total .yen{ font-size:min(clamp(30px,7vw,64px), 13vh); }
    .total .figure{ font-size:min(clamp(64px,20vw,190px), 30vh); }
    .total-label{ font-size:clamp(12px,2.2vh,17px); }
    #live .total-wrap{ gap:2px; }
    .count-pill{ margin-top:2px; }
    .items{ max-height:34vh; }
    .row{ padding:clamp(6px,1.3vh,12px) 2px; }
    .center{ gap:clamp(10px,2vh,20px); }
    .headline{ font-size:clamp(18px,3.4vh,30px); }
    .qcard{ padding:clamp(10px,1.6vh,18px); }
    .qcard img, .qcard canvas{ width:min(clamp(160px,40vw,240px), 44vh); }
    .pin .d{ font-size:clamp(20px,4.6vh,40px); padding:clamp(6px,1vh,12px) clamp(7px,1.4vw,14px); }
    .hint{ font-size:clamp(12px,2.2vh,16px); }
    .subhint{ font-size:clamp(10px,1.7vh,13px); }
  }
  @media (orientation: landscape) and (max-height: 480px){
    .total .figure{ font-size:min(clamp(56px,16vw,150px), 34vh); }
    .items{ max-height:40vh; }
    .headline{ font-size:clamp(16px,4vh,26px); }
    .qcard img, .qcard canvas{ width:min(clamp(140px,34vw,220px), 46vh); }
  }
</style>
</head>
<body>
<div id="app">

  <!-- PAIRING -->
  <section id="pair" class="screen">
    <div class="center">
      <div class="eyebrow">外部ディスプレイを接続</div>
      <div class="headline">売上計算ツールで<br />このコードを読み取り</div>
      <div class="qcard"><div id="qr"></div></div>
      <div class="pin" id="pinDisplay"></div>
      <div class="hint">売上計算ツールの「接続」で<br /><b>QRを読み取る</b>か <b>8桁のPIN</b>を入力してください。</div>
      <div class="subhint">認証は1日1回・9時間有効／このコードは10分で更新されます</div>
    </div>
  </section>

  <!-- LIVE -->
  <section id="live" class="screen">
    <div class="bar">
      <div class="brand"><span class="dot"></span><span class="name" id="title">売上表示</span></div>
      <div class="status">
        <span class="live"><span class="pulse"></span>同期中</span>
        <span class="remain">残り <span class="num" id="remain">9:00:00</span></span>
      </div>
    </div>
    <div class="total-wrap">
      <div class="total-label">合計</div>
      <div class="total"><span class="yen">¥</span><span class="figure num" id="figure">0</span></div>
      <div class="count-pill">点数 <span class="num" id="count">0</span></div>
    </div>
    <div class="items" id="items"></div>
    <div class="foot"><span id="updated">更新を待っています…</span><span>売上同期ディスプレイ</span></div>
  </section>

  <!-- OSHINAGAKI (idle image) -->
  <section id="oshi" class="screen">
    <div class="oshi-wrap"><img id="oshiImg" alt="おしながき" /></div>
  </section>

  <!-- NOTICE (expired / date-locked / error) -->
  <section id="notice" class="screen">
    <div class="center">
      <div class="glyph" id="nGlyph">🌙</div>
      <div class="notice-title" id="nTitle">同期を終了しました</div>
      <div class="notice-body" id="nBody"></div>
      <button class="btn" id="nBtn" type="button">もう一度接続する</button>
    </div>
  </section>

</div>

<button class="fsbtn" id="fsBtn" type="button" aria-label="全画面表示">
  <svg id="fsIcon" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<button class="gear" id="gear" type="button" aria-label="設定">⚙</button>

<div class="modal" id="settings">
  <div class="sheet">
    <h2>設定</h2>
    <p class="sub">この端末にのみ保存されます</p>

    <div class="field">
      <div class="label">おしながき画像</div>
      <div class="preview" id="oshiPreview">画像が未設定です</div>
      <div class="row-btns">
        <button class="mini primary" id="pickImg" type="button">画像を選ぶ</button>
        <button class="mini danger" id="delImg" type="button">削除</button>
      </div>
      <input id="fileInput" type="file" accept="image/png,image/jpeg" hidden />
    </div>

    <div class="field">
      <div class="label">
        待機中におしながきを表示
        <label class="switch"><input type="checkbox" id="oshiToggle" /><span class="track"></span><span class="thumb"></span></label>
      </div>
      <p class="sub" style="margin:0">オンにすると、会計していない間は画像を表示し、金額が入ると自動で計算画面に切り替わります。</p>
    </div>

    <div class="row-btns" style="justify-content:flex-end; margin-top:20px">
      <button class="mini" id="closeSettings" type="button">閉じる</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG
   - 本番: API_BASE を "/api"（同一ドメイン配信）またはフルURLに。
   - プレビュー: API_BASE を "" のままにするとデモが動きます。
   ============================================================ */
const CONFIG = {
  API_BASE: "/api",   // 本番。編集不要（同じドメインで動きます）
  POLL_MS: 600,       // 出力側のポーリング間隔
};
// デプロイ後は本番動作。ローカルで開いた時 or ?demo=1 の時だけ見た目デモ。
const _q = new URLSearchParams(location.search);
const DEMO = !CONFIG.API_BASE || _q.has("demo") || location.protocol === "file:";

/* ---------- device id ---------- */
function deviceId(){
  try{
    let id = localStorage.getItem("salesync.deviceId");
    if(!id){ id = (crypto.randomUUID?.() || (Date.now()+"-"+Math.random())).replace(/-/g,""); localStorage.setItem("salesync.deviceId", id); }
    return id;
  }catch{ return "nostore-"+Math.random().toString(16).slice(2); }
}
function loadSession(){ try{ return JSON.parse(localStorage.getItem("salesync.session")||"null"); }catch{ return null; } }
function saveSession(s){ try{ localStorage.setItem("salesync.session", JSON.stringify(s)); }catch{} }
function clearSession(){ try{ localStorage.removeItem("salesync.session"); }catch{} }

/* ---------- screens ---------- */
const screens = { pair:byId("pair"), live:byId("live"), oshi:byId("oshi"), notice:byId("notice") };
function show(name){ for(const k in screens) screens[k].classList.toggle("on", k===name); }
function byId(id){ return document.getElementById(id); }

/* ---------- API ---------- */
async function api(path, opts){
  const res = await fetch(CONFIG.API_BASE + path, {
    headers:{ "Content-Type":"application/json" }, ...opts,
  });
  return res.json();
}

/* ============================================================
   PAIRING
   ============================================================ */
let qr, pollTimer, pairPin = null, session = null;

function renderPin(pin){
  const box = byId("pinDisplay"); box.innerHTML = "";
  [...pin].forEach((c,i)=>{
    if(i===4){ const s=document.createElement("span"); s.className="sep"; s.textContent="·"; box.appendChild(s); }
    const d=document.createElement("span"); d.className="d num"; d.textContent=c; box.appendChild(d);
  });
}
function renderQR(pin){
  const el = byId("qr"); el.innerHTML = "";
  if(window.QRCode){
    qr = new QRCode(el, { text:pin, width:240, height:240, colorDark:"#201830", colorLight:"#f3ecf7", correctLevel:QRCode.CorrectLevel.M });
  }
}

async function startPairing(){
  show("pair");
  if(DEMO){ return demoPairing(); }
  try{
    const r = await api("/pair/create", { method:"POST", body: JSON.stringify({ deviceId: deviceId() }) });
    if(r.error === "date_locked"){ return showNotice("locked", r.message); }
    if(r.error){ return showNotice("error", "接続を開始できませんでした。時間をおいて再度お試しください。"); }
    session = { sessionId:r.sessionId, outToken:r.outToken, expiresAt:null };
    pairPin = r.pin;
    renderQR(r.pin); renderPin(r.pin);
    startPolling();
  }catch{
    showNotice("error", "サーバーに接続できませんでした。ネットワークを確認してください。");
  }
}

/* ============================================================
   POLLING (pending -> active -> expired)
   ============================================================ */
function startPolling(){
  stopPolling();
  const tick = async ()=>{
    try{
      const r = await api(`/state/pull?sessionId=${encodeURIComponent(session.sessionId)}&token=${encodeURIComponent(session.outToken)}`);
      if(r.status === "pending"){ /* keep showing QR */ }
      else if(r.status === "active"){
        session.expiresAt = r.expiresAt;
        saveSession(session);
        if(!connected){ connected = true; startRemain(); }
        lastState = r.state;
        applyState(r.state);
        routeView(r.state);
      }
      else if(r.status === "expired"){ stopPolling(); clearSession(); showNotice("expired"); return; }
      else if(r.status === "invalid"){
        // pending PIN likely expired unclaimed -> get a fresh one (still same day, pre-auth)
        if(!screens.live.classList.contains("on")){ stopPolling(); startPairing(); return; }
        stopPolling(); clearSession(); showNotice("expired"); return;
      }
    }catch{/* transient network error: keep polling */}
    pollTimer = setTimeout(tick, CONFIG.POLL_MS);
  };
  tick();
}
function stopPolling(){ if(pollTimer){ clearTimeout(pollTimer); pollTimer=null; } }

/* ============================================================
   LIVE DISPLAY
   ============================================================ */
let displayedTotal = 0, remainTimer, lastItemsKey = "";

function enterLive(){ show("live"); startRemain(); }

function startRemain(){
  clearInterval(remainTimer);
  const upd = ()=>{
    if(!session || !session.expiresAt) return;
    let ms = session.expiresAt - Date.now();
    if(ms <= 0){ clearInterval(remainTimer); stopPolling(); clearSession(); showNotice("expired"); return; }
    const s = Math.floor(ms/1000);
    const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
    byId("remain").textContent = `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  };
  upd(); remainTimer = setInterval(upd, 1000);
}

function applyState(state){
  if(!state){ return; }
  if(state.title) byId("title").textContent = state.title;
  const items = Array.isArray(state.items) ? state.items : [];
  const total = Number.isFinite(state.total) ? state.total
    : items.reduce((a,it)=> a + (Number(it.price)||0)*(Number(it.qty)||0), 0);
  const count = items.reduce((a,it)=> a + (Number(it.qty)||0), 0);

  tweenTo(byId("figure"), displayedTotal, total, v=>fmt(Math.round(v)));
  displayedTotal = total;
  byId("count").textContent = fmt(count);

  const key = items.map(it=>`${it.name}|${it.qty}|${it.price}`).join(";");
  renderItems(items, key !== lastItemsKey);
  lastItemsKey = key;

  const ago = state.ts ? Math.max(0, Math.round((Date.now()-state.ts)/1000)) : 0;
  byId("updated").textContent = state.ts ? `更新 ${ago===0?"たった今":ago+"秒前"}` : "更新を待っています…";
}

function renderItems(items, flashLast){
  const box = byId("items"); box.innerHTML = "";
  // newest first, only the ones with qty>0, cap to what fits
  const list = items.filter(it => (Number(it.qty)||0) > 0);
  list.slice().reverse().forEach((it,idx)=>{
    const row = document.createElement("div");
    row.className = "row" + (flashLast && idx===0 ? " flash" : "");
    const price = Number(it.price)||0, qty = Number(it.qty)||0;
    const kind = it.kind!=null ? String(it.kind) : "";
    const isNew = kind==="新刊" || kind==="new" || kind==="NEW";
    const isOld = kind==="既刊" || kind==="old" || kind==="OLD";
    const badge = isNew ? `<span class="kbadge k-new">新刊</span>`
               : isOld ? `<span class="kbadge k-old">既刊</span>` : "";
    row.innerHTML =
      `<span class="name"><span class="nm">${esc(it.name||"（無題）")}</span>${badge}</span>`+
      `<span class="qty"><span class="num">${qty}</span>点 × ¥<span class="num">${fmt(price)}</span></span>`+
      `<span class="sub num">¥${fmt(price*qty)}</span>`;
    box.appendChild(row);
  });
  if(!list.length){
    const e=document.createElement("div"); e.className="row";
    e.innerHTML = `<span class="name" style="color:var(--faint);font-weight:500">頒布物を選ぶと、ここに表示されます</span><span></span><span></span>`;
    box.appendChild(e);
  }
}

/* number tween */
function tweenTo(el, from, to, fmtFn){
  if(from===to){ el.textContent = fmtFn(to); return; }
  const dur = 420, t0 = performance.now();
  const step = (t)=>{
    const p = Math.min(1, (t-t0)/dur);
    const e = 1 - Math.pow(1-p, 3);
    el.textContent = fmtFn(from + (to-from)*e);
    if(p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function fmt(n){ return (n<0?"-":"") + Math.abs(Math.round(n)).toLocaleString("ja-JP"); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ============================================================
   NOTICE SCREENS
   ============================================================ */
function showNotice(kind, msg){
  stopPolling(); clearInterval(remainTimer); clearIdle(); show("notice");
  const g=byId("nGlyph"), t=byId("nTitle"), b=byId("nBody"), btn=byId("nBtn");
  if(kind==="expired"){ g.textContent="🌙"; t.textContent="同期を終了しました"; b.textContent="9時間が経過しました。日付が変わると再接続できます。"; btn.style.display="none"; }
  else if(kind==="locked"){ g.textContent="🔒"; t.textContent="本日は認証済みです"; b.textContent = msg || "日付が変わると再認証できます。"; btn.style.display="none"; }
  else { g.textContent="⚠️"; t.textContent="接続できません"; b.textContent = msg || "時間をおいて再度お試しください。"; btn.style.display="inline-block"; }
}
byId("nBtn").addEventListener("click", ()=>{ clearSession(); boot(); });

/* ============================================================
   OSHINAGAKI (idle image) — settings + view routing
   ============================================================ */
const IDLE_MS = 4000;            // 会計後、待機画像に戻るまでの猶予
let oshiEnabled = true, oshiImage = null;
let connected = false, idleTimer = null, lastState = null;

/* --- IndexedDB (画像はここに保存。localStorageの容量制限を回避) --- */
const IDB_NAME = "salesync", IDB_STORE = "kv";
function idbOpen(){
  return new Promise((res, rej)=>{
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore(IDB_STORE);
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function idbSet(k, v){ const db = await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction(IDB_STORE,"readwrite"); t.objectStore(IDB_STORE).put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function idbGet(k){ const db = await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction(IDB_STORE,"readonly"); const rq=t.objectStore(IDB_STORE).get(k); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); }); }
async function idbDel(k){ const db = await idbOpen(); return new Promise((res,rej)=>{ const t=db.transaction(IDB_STORE,"readwrite"); t.objectStore(IDB_STORE).delete(k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }

/* --- 会計中かどうか（合計>0 か 点数>0 なら会計中） --- */
function isActive(state){
  if(!state) return false;
  const items = Array.isArray(state.items) ? state.items : [];
  const total = Number.isFinite(state.total) ? state.total
    : items.reduce((a,it)=> a + (Number(it.price)||0)*(Number(it.qty)||0), 0);
  const count = items.reduce((a,it)=> a + (Number(it.qty)||0), 0);
  return total > 0 || count > 0;
}
function clearIdle(){ if(idleTimer){ clearTimeout(idleTimer); idleTimer=null; } }

/* --- 接続中の表示切り替え：会計中=計算画面／待機中=おしながき --- */
function routeView(state){
  if(!connected) return;
  if(screens.notice.classList.contains("on")) return;
  if(isActive(state)){
    clearIdle();
    show("live");
    return;
  }
  // 待機（idle）
  if(oshiEnabled && oshiImage){
    if(screens.live.classList.contains("on")){
      // 直前まで計算画面 → 少し待ってから戻す（会計間の点滅防止）
      if(!idleTimer){
        idleTimer = setTimeout(()=>{ idleTimer=null; if(connected && !isActive(lastState)) show("oshi"); }, IDLE_MS);
      }
    }else{
      show("oshi"); // 初回接続などは即おしながき
    }
  }else{
    show("live"); // 画像が無い/オフなら従来どおり計算画面(¥0)
  }
}

/* --- 画像を選択 → 縮小 → 保存 --- */
function downscaleImage(file, maxDim){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let out = c.toDataURL("image/png");
      if(out.length > 3_500_000) out = c.toDataURL("image/jpeg", 0.9);
      res(out);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("load failed")); };
    img.src = url;
  });
}
async function onImagePicked(file){
  const dataUrl = await downscaleImage(file, 2400);
  oshiImage = dataUrl;
  try{ await idbSet("oshi.image", dataUrl); }catch{}
  byId("oshiImg").src = dataUrl;
  refreshSettingsUI();
  routeView(lastState);
}

/* --- 設定UI --- */
function refreshSettingsUI(){
  const p = byId("oshiPreview");
  if(oshiImage){ p.innerHTML = `<img src="${oshiImage}" alt="preview">`; }
  else{ p.textContent = "画像が未設定です"; }
  byId("oshiToggle").checked = oshiEnabled;
  byId("delImg").style.display = oshiImage ? "" : "none";
}
async function initSettings(){
  oshiEnabled = localStorage.getItem("salesync.oshiEnabled") !== "0"; // 既定ON
  try{ oshiImage = await idbGet("oshi.image"); }catch{ oshiImage = null; }
  if(oshiImage) byId("oshiImg").src = oshiImage;
  refreshSettingsUI();
}
byId("gear").addEventListener("click", ()=>{ refreshSettingsUI(); byId("settings").classList.add("on"); });
byId("closeSettings").addEventListener("click", ()=> byId("settings").classList.remove("on"));
byId("settings").addEventListener("click", e=>{ if(e.target.id==="settings") byId("settings").classList.remove("on"); });
byId("pickImg").addEventListener("click", ()=> byId("fileInput").click());
byId("fileInput").addEventListener("change", async e=>{
  const f = e.target.files && e.target.files[0];
  if(f){ try{ await onImagePicked(f); }catch{ alert("画像の読み込みに失敗しました"); } }
  e.target.value = "";
});
byId("delImg").addEventListener("click", async ()=>{
  oshiImage = null;
  try{ await idbDel("oshi.image"); }catch{}
  byId("oshiImg").removeAttribute("src");
  refreshSettingsUI();
  routeView(lastState);
});
byId("oshiToggle").addEventListener("change", e=>{
  oshiEnabled = e.target.checked;
  try{ localStorage.setItem("salesync.oshiEnabled", oshiEnabled ? "1" : "0"); }catch{}
  routeView(lastState);
});

/* ============================================================
   FULLSCREEN（横画面で全画面表示）
   ============================================================ */
(function(){
  const btn = byId("fsBtn"), icon = byId("fsIcon");
  const root = document.documentElement;
  const canFS = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  if(!canFS){ btn.style.display = "none"; return; }  // 非対応端末では非表示
  const inFS = ()=> !!(document.fullscreenElement || document.webkitFullscreenElement);
  const ENTER = "M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5";
  const EXIT  = "M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5";
  function updateIcon(){ icon.querySelector("path").setAttribute("d", inFS() ? EXIT : ENTER); }
  async function enter(){
    try{ await (root.requestFullscreen ? root.requestFullscreen() : root.webkitRequestFullscreen()); }catch{}
    try{ if(screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); }catch{}
  }
  async function exit(){
    try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch{}
    try{ await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen()); }catch{}
  }
  btn.addEventListener("click", ()=>{ inFS() ? exit() : enter(); });
  document.addEventListener("fullscreenchange", updateIcon);
  document.addEventListener("webkitfullscreenchange", updateIcon);
  updateIcon();
})();

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  if(DEMO){ return startPairing(); }
  const s = loadSession();
  if(s && s.expiresAt && Date.now() < s.expiresAt){
    session = s; connected = true; startRemain(); startPolling(); routeView(null);
  }else if(s && s.expiresAt){
    clearSession(); showNotice("expired");
  }else{
    startPairing();
  }
}

/* ============================================================
   DEMO (preview only — no backend)
   ============================================================ */
function demoPairing(){
  const pin = String(Math.floor(Math.random()*1e8)).padStart(8,"0");
  renderQR(pin); renderPin(pin);
  setTimeout(()=>{
    session = { expiresAt: Date.now() + 9*3600*1000 };
    connected = true; startRemain(); demoLoop();
  }, 2600);
}
function demoLoop(){
  const catalog = [
    {name:"新刊「はるのいろ」", price:800, kind:"新刊"},
    {name:"既刊セット", price:1500, kind:"既刊"},
    {name:"アクリルキーホルダー", price:600, kind:"既刊"},
    {name:"ポストカード", price:200, kind:"新刊"},
    {name:"ステッカー", price:300, kind:"既刊"},
  ];
  const title = "二次創作サークル はるつむぎ";
  const push = (items)=>{ lastState = { title, items, ts:Date.now() }; applyState(lastState); routeView(lastState); };
  const transaction = ()=>{
    push([]);                                   // 待機（画像があればおしながき表示）
    const items = catalog.map(c=>({...c, qty:0}));
    const n = 2 + Math.floor(Math.random()*4);
    let i = 0;
    const add = ()=>{
      items[Math.floor(Math.random()*items.length)].qty += 1;
      push(items.map(x=>({...x})));             // 会計中（計算画面）
      if(++i < n){ setTimeout(add, 900 + Math.random()*900); }
      else { setTimeout(()=>{ push([]); setTimeout(transaction, IDLE_MS + 3000); }, 2500); } // 会計完了→待機へ
    };
    setTimeout(add, 1400);
  };
  transaction();
}

/* start */
function start(){ initSettings().finally(boot); }
if(document.readyState==="complete" || document.readyState==="interactive") start();
else window.addEventListener("DOMContentLoaded", start);
</script>
